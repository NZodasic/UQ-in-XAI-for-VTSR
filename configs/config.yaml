# Configurations for TSR Experiment
experiment:
  seed: 42
  device: "cuda"

data:
  train_images_dir: "data/train_data/images/train"
  train_labels_dir: "data/train_data/labels/train"
  val_images_dir: "data/train_data/images/val"
  val_labels_dir: "data/train_data/labels/val"
  test_images_dir: "data/train_data/images/test"
  test_labels_dir: "data/train_data/labels/test"
  classes_file: "train_data/classes.txt"
  image_size: [224, 224]
  num_classes: 29
  batch_size: 32
  num_workers: 4

model:
  name: "resnet50"
  dropout_rate: 0.5
  pretrained: true

training:
  epochs: 50
  learning_rate: 0.001
  optimizer: "adam"    # "adam" or "sgd"
  weight_decay: 0.0001
  patience: 10         # Early stopping patience

uncertainty:
  method: "mc_dropout" # mc_dropout
  num_samples: 30
  
explainability:
  method: "gradcam"   # "gradcam", "saliency", "integrated_gradients"
