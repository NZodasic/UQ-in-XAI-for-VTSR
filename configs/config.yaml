experiment:
  seed: 42
  device: cuda
  deterministic: false
  cudnn_benchmark: true
  save_config: true
  save_summary: true
data:
  train_images_dir: C:\Users\ezycloudx-admin\Desktop\UQ-in-XAI-for-VTSR\Dataset\data2-augment\images\train
  train_labels_dir: C:\Users\ezycloudx-admin\Desktop\UQ-in-XAI-for-VTSR\Dataset\data2-augment\labels\train
  val_images_dir: C:\Users\ezycloudx-admin\Desktop\UQ-in-XAI-for-VTSR\Dataset\data2-augment\images\val
  val_labels_dir: C:\Users\ezycloudx-admin\Desktop\UQ-in-XAI-for-VTSR\Dataset\data2-augment\labels\val
  test_images_dir: C:\Users\ezycloudx-admin\Desktop\UQ-in-XAI-for-VTSR\Dataset\data2-augment\images\test
  test_labels_dir: C:\Users\ezycloudx-admin\Desktop\UQ-in-XAI-for-VTSR\Dataset\data2-augment\labels\test
  classes_file: C:\Users\ezycloudx-admin\Desktop\UQ-in-XAI-for-VTSR\Dataset\data2-augment\custom_data.yaml
  image_size:
  - 224
  - 224
  num_classes: 29
  batch_size: 192
  num_workers: 2
  pin_memory: true
  prefetch_factor: 2
  index_workers: 20
  cache_index: true
model:
  name: efficientnet_b2
  dropout_rate: 0.4
  pretrained: true
training:
  epochs: 10
  learning_rate: 0.0004
  optimizer: adam
  weight_decay: 0.0001
  patience: 1
  early_stopping:
    enabled: true
    monitor: val_accuracy
    mode: max
    patience: 1
    min_delta: 0.001
    restore_best_weights: true
  label_smoothing: 0.1
  grad_clip: 1.0
  scheduler: cosine
  warmup_epochs: 1
  min_lr: 1.0e-06
  mixed_precision: true
  allow_tf32: true
  use_class_weights: true
  log_every_batches: 100
  log_epoch_metrics: true
  checkpoint:
    save_every_epochs: 1
    keep_last: 2
    resume_from: null
  tensorboard:
    enabled: false
    log_dir: tensorboard
uncertainty:
  method: mc_dropout
  num_samples: 10
explainability:
  generate: true
  method: gradcam
  variant: gradcam++
  num_samples: 5
  mc_samples: 5
  steps: 24
  compute_metrics: false
  fidelity_mask_fraction: 0.2
  stability_noise_std: 0.02
calibration:
  temperature_scaling: true
